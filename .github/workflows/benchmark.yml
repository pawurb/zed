name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

# Editor startup under Valgrind Callgrind: the report carries per-function
# instruction counts and allocations instead of timing, so the numbers are
# stable on a shared runner. Callgrind is supported on x86_64 Linux only.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write # the upload authenticates with the job's OIDC token
    env:
      CARGO_PROFILE_RELEASE_FAST_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      # The release-fast build of zed does not fit in the runner's default free disk space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux dependencies
        run: |
          ./script/linux
          sudo apt-get install -y valgrind xvfb mesa-vulkan-drivers
          valgrind --version
      - uses: Swatinem/rust-cache@v2
      - name: Build editor
        run: |
          cargo build --profile release-fast -p zed \
            --features hotpath,hotpath-alloc,hotpath-cloud,hotpath-callgrind
      # Xvfb provides the display and Mesa's lavapipe the Vulkan device. The
      # shutdown delay is wall-clock time, and Callgrind runs the editor
      # 50-100x slower than natively.
      - name: Run editor under Callgrind and upload report
        env:
          HOTPATH_UPLOAD: "fail-on-error"
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_BENCHMARK: editor_startup_callgrind
          HOTPATH_SHUTDOWN_MS: "300000"
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          ZED_ALLOW_EMULATED_GPU: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
            ./target/release-fast/zed
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
