[package]
name = "fsevent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/fsevent.rs"
doctest = false

[dependencies]
hotpath = { path = "../../../hotpath-rs/crates/hotpath", features=['tokio','futures'] }

bitflags.workspace = true
parking_lot.workspace = true
log.workspace = true


[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-alloc-meta = ["hotpath/hotpath-alloc-meta"]
hotpath-mcp= ["hotpath/hotpath-mcp"]
hotpath-mcp-meta= ["hotpath/hotpath-mcp-meta"]
hotpath-meta = ["hotpath/hotpath-meta"]

hotpath-off = ["hotpath/hotpath-off"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
fsevent-sys = "3.0.2"

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-apple-darwin"]
