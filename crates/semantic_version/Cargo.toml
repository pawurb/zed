[package]
name = "semantic_version"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A library for working with semantic versioning in gpui and Zed"

[lints]
workspace = true

[lib]
path = "src/semantic_version.rs"

[dependencies]
hotpath = { path = "../../../hotpath-rs/crates/hotpath", features=['tokio','futures'] }

anyhow.workspace = true
serde.workspace = true

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-alloc-meta = ["hotpath/hotpath-alloc-meta"]
hotpath-mcp= ["hotpath/hotpath-mcp"]
hotpath-mcp-meta= ["hotpath/hotpath-mcp-meta"]
hotpath-meta = ["hotpath/hotpath-meta"]


