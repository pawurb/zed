[package]
name = "html_to_markdown"
version = "0.1.0"
description = "Convert HTML to Markdown"
repository = "https://github.com/zed-industries/zed"
documentation = "https://docs.rs/html_to_markdown"
keywords = ["html", "markdown", "html-to-markdown"]
edition.workspace = true
publish = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/html_to_markdown.rs"

[dependencies]
channels-console = { version = "0.2", optional = true, features = ["futures"] }
hotpath = { version = "0.16", features = ["futures"] }
anyhow.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
regex.workspace = true


[features]
channels-console = ["dep:channels-console"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-alloc-meta = ["hotpath/hotpath-alloc-meta"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-mcp = ["hotpath/hotpath-mcp"]
hotpath-mcp-meta = ["hotpath/hotpath-mcp-meta"]
hotpath-meta = ["hotpath/hotpath-meta"]

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true
